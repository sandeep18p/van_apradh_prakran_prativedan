<ion-header [translucent]="true">
  <ion-toolbar class="custom-toolbar">
    <ion-title class="ion-text-center">LOGIN AS</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-loading cssClass="custom-loading" [isOpen]="isLoading" [message]="loadingMessage"></ion-loading>

  <ion-grid>
    <ion-row>
      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">वृत्त (Circle)</ion-label>
        <ng-select [(ngModel)]="selectedCircleId" (change)="onChangeCircle($event)" class="nice-ng-select"
          [items]="listOfCircle" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="false"
          placeholder="Select circle">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">CCF</ion-label>
        <ng-select [(ngModel)]="selectedCCF" (change)="onSelectCCF($event)" class="nice-ng-select"
          [items]="listCCF" bindLabel="name_to_show" [searchable]="true" [clearable]="true"
          placeholder="Select CCF">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">वन मंडल (Division)</ion-label>
        <ng-select [(ngModel)]="selectedDivisionId" (change)="onChangeDivision($event)" class="nice-ng-select"
          [items]="listOfDivision" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="false"
          placeholder="Select division">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">DFO</ion-label>
        <ng-select [(ngModel)]="selectedDFO" (change)="onSelectDFO($event)" class="nice-ng-select"
          [items]="listDFO" bindLabel="name_to_show" [searchable]="true" [clearable]="true"
          placeholder="Select DFO">
        </ng-select>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">उप वन मंडल (Sub Division)</ion-label>
        <ng-select [(ngModel)]="selectedSubDivisionId" (change)="onChangeSubDivision($event)" class="nice-ng-select"
          [items]="listOfSubDivision" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="false"
          placeholder="Select sub division">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">SDO</ion-label>
        <ng-select [(ngModel)]="selectedSDO" (change)="onSelectSDO($event)" class="nice-ng-select"
          [items]="listSDO" bindLabel="name_to_show" [searchable]="true" [clearable]="true"
          placeholder="Select SDO">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">परिक्षेत्र (Range)</ion-label>
        <ng-select [(ngModel)]="selectedRangId" (change)="onChangeRange($event)" class="nice-ng-select"
          [items]="listOfRang" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="false"
          placeholder="Select range">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">RO</ion-label>
        <ng-select [(ngModel)]="selectedRO" (change)="onSelectRO($event)" class="nice-ng-select"
          [items]="listRO" bindLabel="name_to_show" [searchable]="true" [clearable]="true"
          placeholder="Select RO">
        </ng-select>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">उप परिक्षेत्र (Sub Range)</ion-label>
        <ng-select [(ngModel)]="selectedSubRangId" (change)="onChangeSubRange($event)" class="nice-ng-select"
          [items]="listOfSubRang" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="false"
          placeholder="Select sub range">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">RA (Deputy Ranger)</ion-label>
        <ng-select [(ngModel)]="selectedRA" (change)="onSelectRA($event)" class="nice-ng-select"
          [items]="listRA" bindLabel="name_to_show" [searchable]="true" [clearable]="true"
          placeholder="Select RA">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">बीट (Beat)</ion-label>
        <ng-select [(ngModel)]="selectedBeatId" (change)="onChangeBeat($event)" class="nice-ng-select"
          [items]="listOfBeat" bindLabel="name" bindValue="id" [searchable]="true" [clearable]="false"
          placeholder="Select beat">
        </ng-select>
      </ion-col>

      <ion-col size="12" size-lg="3">
        <ion-label class="responsive-label">BFO (Beat Officer)</ion-label>
        <ng-select [(ngModel)]="selectedBFO" (change)="onSelectBFO($event)" class="nice-ng-select"
          [items]="listBFO" bindLabel="name_to_show" [searchable]="true" [clearable]="true"
          placeholder="Select BFO">
        </ng-select>
      </ion-col>
    </ion-row>

    <ion-row class="ion-margin-top">
      <!-- <ion-col size="12" size-lg="6">
        <ion-label class="responsive-label">Reason (optional)</ion-label>
        <ion-input fill="outline" placeholder="Reason for login as" [(ngModel)]="reason"></ion-input>
      </ion-col> -->

      <ion-col size="12" size-lg="6">
        <div class="target-box" *ngIf="selectedTarget as t">
          <div><strong>Selected:</strong> {{ t.name_to_show }}</div>
          <div><strong>Mobile:</strong> {{ t.emp_mobile_number }}</div>
          <div><strong>Password:</strong> {{ t.password }}</div>
        </div>

        <div class="button-row">
          <ion-button expand="block" (click)="loginAsSelected()">Login as</ion-button>
          <ion-button expand="block" color="medium" (click)="exitLoginAs()">Exit Login As</ion-button>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
