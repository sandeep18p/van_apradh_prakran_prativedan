<ion-header class="ion-header-toolbar">

  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()" class="custom-back-button">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="responsive-toolbar-title">
      {{ getTranslation('janch_awadhi_badhane_hetu_awedan') }} ({{toolbarTitle}})
    </ion-title>

  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-loading cssClass="custom-loading" [isOpen]="isLoading" [message]="loadingMessage"></ion-loading>

  <ion-grid>

    <ion-row class="ion-justify-content-center">


      <ion-col size-lg="1" />
      <ion-col size-lg="10" size="12">


        <ion-row class="totals-container">

          <ion-col size="12" class="total-card">
            <ion-row>
              <ion-col size="12">
                <ion-label>
                  प्रति,<br />
                  वन परिक्षेत्र अधिकारी ({{ approverName}}),<br />
                  इस प्रकरण में अपरिहार्य कारणों से जाँच कार्य पूर्ण नहीं हो पा रहा है, कृपया निम्नानुसार समयवृद्धि करने
                  की कृपा करें |
                </ion-label>
              </ion-col>

              <ion-col size="12" class="center-container" style="margin-top: 50px;">
                <ion-row class="days-row">
                  <ion-col size="7" size-sm="8" class="label-col">
                    <ion-label class="ion-text-wrap">
                      जाँच हेतु आवश्यक दिनों की संख्या
                    </ion-label>
                  </ion-col>

                  <ion-col size="5" size-sm="4" class="input-col">
                    <ion-item fill="outline" lines="none" class="days-item">
                      <ion-input type="number" inputmode="numeric" min="1" max="30" [(ngModel)]="totalDaysToExtend"  placeholder="दिन"></ion-input>

                    </ion-item>
                  </ion-col>
                </ion-row>
              </ion-col>

            </ion-row>


          </ion-col>

        </ion-row>

        <ion-row>
          <ion-col size="6" size-lg="6">
            <ion-button expand="block" class="submit-button" (click)="submitOnServer()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              SUBMIT
            </ion-button>
          </ion-col>
          <ion-col size="6" size-lg="6">
            <ion-button expand="block" (click)="cancel()" class="cancel-button">
              <ion-icon name="close-circle-outline" slot="start"></ion-icon>
              CANCEL
            </ion-button>
          </ion-col>
        </ion-row>

      </ion-col>
      <ion-col size-lg="1" />

    </ion-row>
  </ion-grid>
</ion-content>
