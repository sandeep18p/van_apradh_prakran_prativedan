<ion-header class="ion-header-toolbar">

  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="cancel()" class="custom-back-button">
        <ion-icon slot="icon-only" name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>

    <ion-title class="responsive-toolbar-title">
      {{ getTranslation('court_challan_se_related_document') }} ({{toolbarTitle}})
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-loading cssClass="custom-loading" [isOpen]="isLoading" [message]="loadingMessage"></ion-loading>

  <ion-grid>

    <ion-row class="ion-justify-content-center">


      <ion-col size-lg="1" />
      <ion-col size-lg="10" size="12">

        <ion-row>

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openFardGirftari()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              फर्द गिरफ्तारी
            </ion-button>
          </ion-col>

          <!-- <ion-col size="6" size-lg="3"></ion-col> -->

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openGirftariSuchna()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              गिरफ्तारी सूचना
            </ion-button>
          </ion-col>

          <!-- <ion-col size="6" size-lg="3"></ion-col> -->

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openChallanForm()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              चालान फार्म
            </ion-button>
          </ion-col>

          <!-- <ion-col size="6" size-lg="3"></ion-col> -->

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openCheckList()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              चेक लिस्ट
            </ion-button>
          </ion-col>

          <!-- <ion-col size="6" size-lg="3"></ion-col> -->

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openRemandForm()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              रिमांड फॉर्म
            </ion-button>
          </ion-col>

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openAccussedList()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              अपराधियों की सूची
            </ion-button>
          </ion-col>

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" class="submit-button" (click)="openWitnessList()">
              <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
              साक्षियों की सूची
            </ion-button>
          </ion-col>

          <!-- <ion-col size="6" size-lg="3"></ion-col> -->

          <ion-col size="6" size-lg="3">
            <ion-button expand="block" (click)="cancel()" class="cancel-button">
              <ion-icon name="close-circle-outline" slot="start"></ion-icon>
              CANCEL
            </ion-button>
          </ion-col>
        </ion-row>

        <ion-row class="ion-margin-top separation-row">
          <ion-col size="12">
            <h3 class="court-section-title">कोर्ट केस नंबर विवरण</h3>
          </ion-col>
          <ion-col size="12" size-lg="4">
            <ion-item lines="outline" class="custom-input-item">
              <ion-input label="कोर्ट केस नंबर" label-placement="floating" [(ngModel)]="court_case_number"
                [disabled]="!show_court_case_submit_button"></ion-input>
            </ion-item>
          </ion-col>
          <ion-col size="12" size-lg="4">
            <ion-item lines="outline" class="custom-input-item"
              (click)="show_court_case_submit_button && selectCourtPrastutiDate()">
              <ion-input label="प्रस्तुति दिनांक" label-placement="floating" [value]="court_prastuti_date" readonly
                [disabled]="!show_court_case_submit_button"></ion-input>
              <ion-icon name="calendar-outline" slot="end" style="margin-top: 20px;"></ion-icon>
            </ion-item>
          </ion-col>
          <ion-col *ngIf="show_court_case_submit_button" size="12" size-lg="4" class="ion-align-self-center">
            <ion-button expand="block" class="submit-button" (click)="submitCourtCaseNumberDetail()">
              SUBMIT
            </ion-button>
          </ion-col>
        </ion-row>

        <ion-row class="ion-margin-top separation-row">
          <ion-col size="12">
            <h3 class="court-section-title">कोर्ट का आदेश</h3>
          </ion-col>
          <ion-col size="12" size-lg="8">
            <ion-item lines="outline" class="custom-input-item">
              <ion-label position="stacked">आदेश अपलोड करें (PDF)</ion-label>
              <input type="file" (change)="onAdeshFileSelected($event)" accept="application/pdf"
                class="full-width-file-input" />
            </ion-item>
          </ion-col>
          <ion-col size="12" size-lg="4" class="ion-align-self-center">
            <ion-button expand="block" class="submit-button" (click)="submitCourtAdesh()">
              SUBMIT
            </ion-button>
          </ion-col>
        </ion-row>


      </ion-col>
      <ion-col size-lg="1" />

    </ion-row>

  </ion-grid>

</ion-content>
