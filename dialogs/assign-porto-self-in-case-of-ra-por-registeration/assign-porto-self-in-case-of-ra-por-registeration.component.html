<div class="dialog-wrapper">

  <ion-grid class="dialog-card">
    <ion-row class="ion-justify-content-center">
      <ion-col size="12">

        <ion-label class="ion-label-large" style="font-weight: 700; margin-top: 10px;">{{ro_name}}</ion-label>

      </ion-col>

      <ion-col size="12">
        <ion-textarea [(ngModel)]="ro_remark" fill="outline" label="जाँच अधिकारी के लिए कुछ टिप्पणी लिखना हो तो"
          label-placement="floating" auto-grow="true" rows="5" class="remark-textarea"></ion-textarea>
      </ion-col>

      <ion-col size="6">
        <ion-label class="ion-label-small"
          style="display:flex; align-items:center; justify-content:flex-start; color: blue;">
          FOCR क्रमाँक 
        </ion-label>
      </ion-col>
      <ion-col size="6">
        <ion-input class="ion-input" [(ngModel)]="focr_number" fill="outline" />
      </ion-col>

      <ion-col size="6" style="margin-top: 20px;">
        <ion-label style="display: flex; align-items: center; justify-content: space-between;" class="ion-label-small"
          style="color: blue;">FOCR दिनांक</ion-label>
      </ion-col>
      <ion-col size="6" style="margin-top: 20px;">
        <div class="date-picker-card" (click)="onSelecteFocrDate()">
          <ion-label style="margin-left: 10px;" class="date-label">
            {{ focr_date ? (focr_date | date:'dd-MM-yyyy') : ' दिनांक ' }}
          </ion-label>
          <ion-icon style="color: black;" name="calendar-outline"></ion-icon>
        </div>
      </ion-col>

    </ion-row>

    <ion-row class="ion-justify-content-between ion-margin-top button-row">
      <ion-col size="6">
        <ion-button expand="block" color="success" shape="round" (click)="clickToAssignSelf()">
          सबमिट
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" color="danger" shape="round" (click)="cancel()">
          समाप्त
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>
